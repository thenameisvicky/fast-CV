<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>fast-CV settings</title>
  <style>
    body { font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif; max-width: 620px; margin: 40px auto; padding: 0 20px; color: #ececf1; background: #0f0f12; }
    h1 { font-size: 19px; font-weight: 800; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; color: #ffffff; }
    p.sub { color: #acacbe; margin-top: 0; }
    label { display: block; font-weight: 700; margin: 22px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #acacbe; }
    input { width: 100%; padding: 9px 11px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; font: inherit; background: rgba(255, 255, 255, 0.05); color: #ffffff; box-sizing: border-box; transition: all 0.2s; }
    input:focus { outline: none; border-color: #ff4d4d; box-shadow: 0 0 8px rgba(255, 77, 77, 0.25); }
    button { margin-top: 16px; background: #ff4d4d; color: #ffffff; border: none; border-radius: 6px; padding: 9px 16px; font-weight: 600; cursor: pointer; text-transform: uppercase; font-size: 11px; transition: all 0.2s; }
    button:hover { background: #e03c3c; box-shadow: 0 0 12px rgba(255, 77, 77, 0.3); }
    #msg { margin-top: 14px; font-size: 13px; font-weight: 500; }
    .ok { color: #10b981; font-weight: bold; } .bad { color: #ef4444; text-decoration: underline; }
    .row { margin-top: 10px; font-size: 12px; color: #acacbe; }
    code { background: rgba(255, 255, 255, 0.05); padding: 2px 4px; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>fast-CV</h1>
  <p class="sub">Everything runs on this machine. Nothing is sent anywhere else.</p>
 
  <label for="url">Server address</label>
  <input id="url" placeholder="http://127.0.0.1:7788">
  <div class="row">Start it with <code>npm run dev</code> in the fast-CV folder.</div>
 
  <button id="save">Save</button>
  <button id="check" style="background: rgba(255, 255, 255, 0.03); color: #ececf1; border: 1px solid rgba(255, 255, 255, 0.08); margin-left: 8px;">Test connection</button>
  <div id="msg"></div>

  <script src="options.js"></script>
</body>
</html>
